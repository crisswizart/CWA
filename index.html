        <script id="fragShader" type="x-shader/x-fragment">
          precision mediump float;
          uniform vec3 iResolution;
          uniform float iTime;
          uniform float uScale;
          uniform float uWhiteOut;
          
          uniform sampler2D tex0;
          uniform sampler2D tex1;
          uniform sampler2D tex2;

          float getOpacity(float time, float delay) {
              float localTime = mod(time - delay + 15.0, 15.0);
              if (localTime < 2.25) return localTime / 2.25;
              if (localTime < 4.95) return 1.0;
              if (localTime < 7.20) return 1.0 - (localTime - 4.95) / 2.25;
              return 0.0;
          }

          vec4 getBackground(vec2 uv, float op0, float op1, float op2) {
              vec2 centeredUV = uv - 0.5;
              float screenAspect = iResolution.x / iResolution.y;
              float imgAspect = 16.0 / 9.0; 
              
              if (screenAspect < imgAspect) {
                  centeredUV.x *= screenAspect / imgAspect;
              } else {
                  centeredUV.y *= imgAspect / screenAspect;
              }
              
              vec2 coverUV = centeredUV + 0.5;
              vec2 finalUV = vec2(coverUV.x, 1.0 - coverUV.y);
              
              vec4 col = vec4(0.0);
              if (op0 > 0.001) col += texture2D(tex0, finalUV) * op0;
              if (op1 > 0.001) col += texture2D(tex1, finalUV) * op1;
              if (op2 > 0.001) col += texture2D(tex2, finalUV) * op2;
              return col;
          }

          void mainImage(out vec4 fragColor, in vec2 fragCoord)
          {
            const float NUM_ZERO = 0.0;
            const float NUM_ONE = 1.0;
            const float NUM_HALF = 0.5;
            const float POWER_EXPONENT = 6.0;
            const float MASK_MULTIPLIER_1 = 10000.0;
            const float MASK_MULTIPLIER_2 = 9500.0;
            const float LENS_MULTIPLIER = 5000.0;
            const float MASK_STRENGTH_1 = 8.0;
            const float MASK_STRENGTH_2 = 16.0;
            const float MASK_THRESHOLD_1 = 0.95;
            const float MASK_THRESHOLD_2 = 0.9;
            const float SAMPLE_RANGE = 2.0;
            const float SAMPLE_OFFSET = 1.0;

            vec2 uv = fragCoord / iResolution.xy;
            vec2 center = iResolution.xy / 2.0;
            vec2 m2 = (uv - center / iResolution.xy);

            float morph = 1.0 + 0.04 * sin(iTime * 2.0 + atan(m2.y, m2.x) * 4.0);
            float dist = length(m2 * vec2(iResolution.x / iResolution.y, 1.0)) * morph;
            
            float BASE_SIZE = (iResolution.x < 768.0) ? 1.2 : 0.72; 
            dist = (dist * BASE_SIZE) / max(uScale, 0.001); 

            float roundedBox = pow(dist, POWER_EXPONENT);

            float rb1 = clamp((NUM_ONE - roundedBox * MASK_MULTIPLIER_1) * MASK_STRENGTH_1, NUM_ZERO, NUM_ONE);
            float rb2 = clamp((MASK_THRESHOLD_1 - roundedBox * MASK_MULTIPLIER_2) * MASK_STRENGTH_2, NUM_ZERO, NUM_ONE) -
              clamp(pow(MASK_THRESHOLD_2 - roundedBox * MASK_MULTIPLIER_2, NUM_ONE) * MASK_STRENGTH_2, NUM_ZERO, NUM_ONE);

            float transition = smoothstep(NUM_ZERO, NUM_ONE, rb1 + rb2);

            if (transition > NUM_ZERO) {
              if (uWhiteOut >= 0.999) {
                  fragColor = vec4(1.0, 1.0, 1.0, transition);
                  return;
              }

              float op0 = getOpacity(iTime, 0.0);
              float op1 = getOpacity(iTime, 5.0);
              float op2 = getOpacity(iTime, 10.0);

              vec2 lens = ((uv - NUM_HALF) * NUM_ONE * (NUM_ONE - roundedBox * LENS_MULTIPLIER) + NUM_HALF);
              
              vec4 blurredColor = vec4(NUM_ZERO);
              float total = NUM_ZERO;
              for (float x = -SAMPLE_RANGE; x <= SAMPLE_RANGE; x++) {
                for (float y = -SAMPLE_RANGE; y <= SAMPLE_RANGE; y++) {
                  vec2 offset = vec2(x, y) * SAMPLE_OFFSET / iResolution.xy;
                  blurredColor += getBackground(offset + lens, op0, op1, op2);
                  total += NUM_ONE;
                }
              }
              blurredColor /= total;

              vec4 lighting = clamp(blurredColor, NUM_ZERO, NUM_ONE);
              vec4 finalColor = mix(getBackground(uv, op0, op1, op2), lighting, transition);
              finalColor = mix(finalColor, vec4(1.0), uWhiteOut);

              fragColor = vec4(finalColor.rgb, transition);
            } else {
              fragColor = vec4(0.0);
            }
          }
          void main() { mainImage(gl_FragColor, gl_FragCoord.xy); }
        </script>
